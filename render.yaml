services:
  - type: web
    name: bihar-election-tracker
    env: python
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements-flask.txt
    startCommand: python -m gunicorn map_app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
