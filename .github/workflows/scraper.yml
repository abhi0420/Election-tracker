name: Election Data Scraper

on:
  schedule:
    # Runs every 5 minutes (safe buffer - job takes ~5 mins, won't overlap)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  
  # Prevent concurrent runs to avoid git conflicts
concurrency:
  group: election-scraper
  cancel-in-progress: false  # Wait for current job to finish
  
permissions:
  contents: write  # Required for private repos to commit

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y wget gnupg
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run scraper
      run: python scraper.py
      
    - name: Commit and push if changed
      run: |
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        git add -A
        timestamp=$(date -u)
        git commit -m "Update election data: ${timestamp}" || exit 0
        
        # Retry push up to 3 times in case of conflicts
        max_attempts=3
        attempt=1
        until git push
        do
          if [ $attempt -ge $max_attempts ]; then
            echo "Failed to push after $max_attempts attempts"
            exit 1
          fi
          echo "Push failed, pulling and retrying (attempt $attempt/$max_attempts)..."
          git pull --rebase
          attempt=$((attempt + 1))
          sleep 2
        done
