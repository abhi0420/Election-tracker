services:
  - type: web
    name: election-tracker
    env: python
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements-flask.txt
    startCommand: python -m gunicorn map_app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates secure random value
